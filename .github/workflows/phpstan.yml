name: PHPStan

# Checks this repository and is the shared workflow every Internet Guru repository calls:
#   jobs:
#     phpstan:
#       uses: internetguru/laravel-scripts/.github/workflows/phpstan.yml@main
on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_call:
    inputs:
      php-version:
        type: string
        default: '8.4'
      extensions:
        type: string
        default: 'mbstring, xml, ctype, json, bcmath, intl, gd, sockets, sqlite3, pdo_sqlite'

jobs:
  phpstan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version || '8.4' }}
          extensions: ${{ inputs.extensions || 'mbstring, xml, ctype, json, bcmath, intl, gd, sockets, sqlite3, pdo_sqlite' }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github
